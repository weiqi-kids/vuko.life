name: Weekly Analytics Report

on:
  schedule:
    - cron: '0 9 * * 1'  # 每週一 09:00 UTC (台灣 17:00)
  workflow_dispatch:      # 允許手動觸發

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Lighthouse)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install requests
          npm install -g lighthouse

      - name: Fetch GitHub Traffic Data
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python .github/scripts/fetch_traffic.py

      - name: Run Site Audit
        run: |
          # Initialize empty audit.json in case audit fails
          echo '{}' > /tmp/audit.json
          chmod +x ./revamp/tools/site-audit.sh
          ./revamp/tools/site-audit.sh https://www.vuko.life --output /tmp/audit.json || echo "Site audit skipped or failed"

      - name: Generate Weekly Report
        run: python .github/scripts/generate_report.py

      - name: Commit and Push Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Add weekly report $(date +%Y-%m-%d) [skip ci]"
          git push
