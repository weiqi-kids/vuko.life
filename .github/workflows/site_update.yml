name: Site Update

on:
  push:
    branches: [main]
    paths:
      - 'i18n/base.json'
      - 'i18n/overrides/**'
      - 'music/base.json'
      - 'content/**'
      - '.github/scripts/**'
      - '.github/workflows/site_update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Bake the source JSON (content/*.json + i18n/*.json) into the static
  # app/*.html + index.html and deploy. Pure stdlib — no external services.
  # (The old OpenAI translation step was removed; the 30 i18n/*.json files are
  # now static. To re-introduce auto-translation, do it with Claude, not OpenAI.)
  prerender:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      music_changed: ${{ steps.scope.outputs.music_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Tip of main (not the trigger SHA) so the commit this job pushes lands
          # fast-forward even if main advanced after the push.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Detect music change scope
        # Embedding only needs to run when music/base.json changed in this push.
        id: scope
        run: |
          base='${{ github.event.before }}'
          head='${{ github.event.after }}'
          if [ -n "$base" ] && [ "$base" != '0000000000000000000000000000000000000000' ] && git cat-file -e "$base" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$head")
            echo "changed in push:"; echo "$changed"
            if echo "$changed" | grep -qE '^music/base\.json'; then
              echo 'music_changed=1' >> "$GITHUB_OUTPUT"
            else
              echo 'music_changed=0' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'no usable push range (manual dispatch?) — running embedding to be safe'
            echo 'music_changed=1' >> "$GITHUB_OUTPUT"
          fi
      - name: Prerender static SEO content
        # Bake content/<lang>.json long-form, crawlable lang-nav, keyword-rich
        # <title>/meta and FAQ JSON-LD from i18n into every app/*.html + index.html.
        run: python .github/scripts/prerender_content.py
      - name: Commit prerendered content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain app/*.html index.html)" ]; then
            git add app/*.html index.html
            git commit -m "Prerender content updates [skip ci]"
            # Rebase onto any commit that landed during this job so the push
            # (e.g. against a concurrent [skip ci] push) is never rejected.
            git pull --rebase origin main && git push
          else
            echo "no HTML change to commit"
          fi

  embedding:
    needs: prerender
    if: ${{ needs.prerender.outputs.music_changed == '1' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Tip of main, which includes the commit the prerender job just pushed.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run embedding
        id: run
        continue-on-error: true
        run: |
          # The frontend (js/audio_selector.js) only ever loads music/base.json,
          # so only base.json's embedding is actually used — compute just that one.
          python .github/scripts/embedding.py music/base.json >> embedding.log 2>&1
      - name: Detect embedding change
        if: steps.run.outcome == 'success'
        id: detect
        run: |
          if [ -n "$(git status --porcelain music/*.json)" ]; then
            echo 'changed=1' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: embedding-log
          path: embedding.log
      - name: Commit embedding updates
        if: steps.run.outcome == 'success' && steps.detect.outputs.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=$(git status --porcelain music/*.json | awk '{print $2}' | tr '\n' ' ')
          git add $files
          git commit -m "Update embeddings [skip ci]" -m "$files"
          git push
      - name: Commit embedding failure summary
        if: steps.run.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(tail -n 20 embedding.log | tr '\n' ' ')
          git commit --allow-empty -m "Embedding failed [skip ci]" -m "$msg"
          git push
      - name: Fail job if embedding failed
        if: steps.run.outcome != 'success'
        run: exit 1

  screenshot:
    needs: [prerender, embedding]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.prerender.result == 'success' && (needs.embedding.result == 'success' || needs.embedding.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Tip of main (incl. prerender's + embedding's pushed commits) so this
          # job's screenshot-summary commit pushes fast-forward.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install playwright Pillow
          playwright install --with-deps chromium
      - name: Run screenshot
        id: run
        continue-on-error: true
        run: |
          python .github/scripts/screenshot.py --out output > screenshot.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "screenshot failed" >> screenshot.log
            exit $status
          fi
      - name: Check screenshots
        run: |
          ls -lh output
          file output/*.jpg
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: output
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-log
          path: screenshot.log
      - name: Comment screenshot artifact
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="Download screenshots from [workflow run artifacts]($RUN_URL)"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -d "{\"body\":\"$body\"}" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
      - name: Commit screenshot summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(tail -n 20 screenshot.log | tr '\n' ' ')
          git commit --allow-empty -m "Screenshot results [skip ci]" -m "$msg"
          git push
      - name: Fail job if screenshot failed
        if: steps.run.outcome != 'success'
        run: exit 1

  # NOTE: no deploy job. GitHub Pages for this repo is a "Deploy from a branch"
  # (legacy) site — the built-in `pages-build-deployment` publishes main on
  # every push.
