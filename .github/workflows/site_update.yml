name: Site Update

on:
  push:
    branches: [main]
    paths:
      - 'i18n/base.json'
      - 'i18n/overrides/**'
      - 'music/base.json'
      - 'content/**'
      - '.github/scripts/**'
      - '.github/workflows/site_update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  translate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      langs: ${{ steps.detect.outputs.langs }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Check out the tip of main (not the trigger SHA) so the commit this
          # job pushes lands fast-forward even if main advanced after the push.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load languages
        id: langs
        run: |
          list=$(ls app/*.html | xargs -n1 basename | sed 's/\.html$//' | grep -v '^index$' | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Run translations
        id: run
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          failed=0
          for lang in ${{ steps.langs.outputs.list }}; do
            python .github/scripts/translate.py i18n/base.json i18n/$lang.json >> translate.log 2>&1
            if [ $? -ne 0 ]; then
              echo "i18n $lang failed" >> translate.log
              failed=1
            fi
            python .github/scripts/translate.py music/base.json music/$lang.json >> translate.log 2>&1
            if [ $? -ne 0 ]; then
              echo "music $lang failed" >> translate.log
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            exit 1
          fi
      - name: Detect changes
        id: detect
        run: |
          files=$(git status --porcelain i18n/*.json music/*.json | awk '{print $2}')
          if [ -n "$files" ]; then
            echo 'changed=1' >> "$GITHUB_OUTPUT"
            langs=$(echo "$files" | grep '^music/' | awk -F'[/.]' '{print $(NF-1)}' | sort -u | tr '\n' ' ')
            echo "langs=$langs" >> "$GITHUB_OUTPUT"
          else
            echo 'changed=0' >> "$GITHUB_OUTPUT"
            echo 'langs=' >> "$GITHUB_OUTPUT"
          fi
      - name: Prerender static SEO content
        # Re-bake content/<lang>.json long-form, crawlable lang-nav, and the
        # keyword-rich <title>/meta tags from the freshly translated i18n into
        # every app/*.html + index.html. Must run after translations so the
        # static HTML never drifts from i18n (the cause of the old keyword-free
        # <title> bug); committed alongside the translation update below.
        if: steps.run.outcome == 'success'
        run: python .github/scripts/prerender_content.py
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translate-log
          path: translate.log
      - name: Commit translation updates
        if: steps.run.outcome == 'success' && steps.detect.outputs.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=$(git status --porcelain i18n/*.json music/*.json | awk '{print $2}' | tr '\n' ' ')
          git add i18n/*.json music/*.json app/*.html index.html
          git commit -m "Update translations [skip ci]" -m "$files"
          # Rebase onto any commits that landed during the long translate step
          # (e.g. a concurrent [skip ci] push) so the push is never rejected.
          git pull --rebase origin main && git push
      - name: Commit translation failure summary
        if: steps.run.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(tail -n 20 translate.log | tr '\n' ' ')
          git commit --allow-empty -m "Translation failed [skip ci]" -m "$msg"
          git pull --rebase origin main && git push
      - name: Fail job if translate failed
        if: steps.run.outcome != 'success'
        run: exit 1

  embedding:
    needs: translate
    if: ${{ needs.translate.outputs.changed == '1' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Check out the tip of main, which includes the commit the translate
          # job just pushed — otherwise this job's own commit/push lands on a
          # stale base and is rejected non-fast-forward.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run embedding
        id: run
        continue-on-error: true
        run: |
          # The frontend (js/audio_selector.js) only ever loads music/base.json,
          # so only base.json's embedding is actually used. We compute just that
          # one file instead of all 30 languages — this removes pure dead work
          # and the checkout race condition where translate-created language
          # files (e.g. music/ar.json) were absent at this job's checked-out ref,
          # causing FileNotFoundError.
          python .github/scripts/embedding.py music/base.json >> embedding.log 2>&1
      - name: Detect embedding change
        if: steps.run.outcome == 'success'
        id: detect
        run: |
          if [ -n "$(git status --porcelain music/*.json)" ]; then
            echo 'changed=1' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: embedding-log
          path: embedding.log
      - name: Commit embedding updates
        if: steps.run.outcome == 'success' && steps.detect.outputs.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=$(git status --porcelain music/*.json | awk '{print $2}' | tr '\n' ' ')
          git add $files
          git commit -m "Update embeddings [skip ci]" -m "$files"
          git push
      - name: Commit embedding failure summary
        if: steps.run.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(tail -n 20 embedding.log | tr '\n' ' ')
          git commit --allow-empty -m "Embedding failed [skip ci]" -m "$msg"
          git push
      - name: Fail job if embedding failed
        if: steps.run.outcome != 'success'
        run: exit 1

  screenshot:
    needs: [translate, embedding]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && needs.translate.result == 'success' && (needs.embedding.result == 'success' || needs.embedding.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Tip of main (incl. translate's + embedding's pushed commits) so this
          # job's screenshot-summary commit pushes fast-forward.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install playwright Pillow
          playwright install --with-deps chromium
      - name: Run screenshot
        id: run
        continue-on-error: true
        run: |
          python .github/scripts/screenshot.py --out output > screenshot.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "screenshot failed" >> screenshot.log
            exit $status
          fi
      - name: Check screenshots
        run: |
          ls -lh output
          file output/*.jpg
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: output
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-log
          path: screenshot.log
      - name: Comment screenshot artifact
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="Download screenshots from [workflow run artifacts]($RUN_URL)"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -d "{\"body\":\"$body\"}" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
      - name: Commit screenshot summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(tail -n 20 screenshot.log | tr '\n' ' ')
          git commit --allow-empty -m "Screenshot results [skip ci]" -m "$msg"
          git push
      - name: Fail job if screenshot failed
        if: steps.run.outcome != 'success'
        run: exit 1

  # NOTE: no deploy job. GitHub Pages for this repo is a "Deploy from a branch"
  # (legacy) site — the built-in `pages-build-deployment` publishes main on
  # every push. The old actions/deploy-pages job never deployed anything here
  # (that requires Pages build_type "workflow") and was failing on the retired
  # actions/upload-artifact@v3, turning the whole run red for nothing.

