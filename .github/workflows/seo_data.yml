name: SEO Data Snapshot

# The "sensor" of vuko.life's daily self-optimization loop. Pulls GA4 + GSC +
# index coverage each morning and commits a machine-readable snapshot to
# seo/data/, which the cloud "vuko-daily-optimize" routine (cron 03:40 UTC)
# reads ~1.5h later to decide + ship that day's optimizations.
#
# Runs ~02:00 UTC so even if GitHub's scheduler is delayed the snapshot is in
# place well before the optimize routine. Manual run via "Run workflow".

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 10:00 Taipei
  workflow_dispatch:

permissions:
  contents: write

# Never run two snapshots at once (a delayed schedule + a manual dispatch).
concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Google API client libraries
        run: pip install google-analytics-data google-api-python-client google-auth

      - name: Fetch GA4/GSC/index snapshot
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: python .github/scripts/seo_data.py seo/data/latest.raw.md

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # seo/data/** is not in site_update.yml's path filter, and [skip ci]
          # is belt-and-suspenders — this commit never triggers a site rebuild.
          git add seo/data/latest.raw.md seo/data/index-coverage-history.jsonl
          if git diff --staged --quiet; then
            echo "no data change — nothing to commit"
          else
            git commit -m "data: GA4/GSC/index snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main && git push
          fi
