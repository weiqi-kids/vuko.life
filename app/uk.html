<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Безкоштовний AI-гід з дихання з відкритим кодом - Використовуйте бінауральні ритми для медитації, концентрації або глибокого сну. Моніторинг дихання в реальному часі. 100% безкоштовно.">
    <title>With sound, meet a better version of yourself</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="With sound, meet a better version of yourself" />
    <meta property="og:description" content="Безкоштовний AI-гід з дихання з відкритим кодом. Використовуйте бінауральні ритми для медитації, концентрації або глибокого сну." />
    <meta property="og:image" content="https://www.vuko.life/assets/uk/home-og.jpg" />
    <meta property="og:url" content="https://www.vuko.life/app/uk.html" />

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="With sound, meet a better version of yourself">
    <meta name="twitter:description" content="Безкоштовний AI-гід з дихання з відкритим кодом. Використовуйте бінауральні ритми для медитації, концентрації або глибокого сну.">
    <meta name="twitter:image" content="https://www.vuko.life/assets/uk/home-og.jpg">
    <base href="../">
    <link rel="canonical" href="https://www.vuko.life/app/uk.html" />
    <link rel="stylesheet" href="assets/base.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vuko - AI Breathing Rhythm Processor",
        "description": "Use binaural beats to guide yourself into meditation, focus, relaxation, or sleep",
        "url": "https://www.vuko.life/app/uk.html",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "featureList": ["Binaural Beats", "Breath Monitoring", "Meditation", "Sleep Aid", "Focus Enhancement"]
    }
    </script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
    </button>
    <div class="container">
        <h1 id="mainTitle">With sound, meet a better version of yourself</h1>

        <h2 id="sectionInstructions" class="section-title"></h2>
        <div class="adaptive-mode">
            <h3></h3>
            <ul>
                <li id="instructionHeadphones"></li>
                <li id="instructionMicrophone"></li>
            </ul>
        </div>

        
        <h2 id="sectionSettings" class="section-title"></h2>
        <div class="config-audio-container">
            <div class="audio-search-section">
                <h3 id="audioSearchTitle"></h3>
                <div class="audio-tabs">
                    <button id="tabLibrary" class="tab-button active"></button>
                    <button id="tabLocal" class="tab-button"></button>
                </div>
                <div id="libraryTabContent">
                    <div class="search-container">
                        <input type="text" id="musicSearchInput" class="search-input" placeholder="">
                    </div>
                    <div id="searchResults" class="search-results" style="display: none;"></div>
                </div>
                <div id="localTabContent" style="display: none;">
                    <input type="file" id="localFileInput" accept="audio/*">
                    <div class="privacy-msg" id="filePrivacyMsg"></div>
                </div>
                <div id="currentSelection" class="current-selection" style="display: none;">
                    <div class="current-selection-label" id="currentSelectionLabel"></div>
                    <div class="current-selection-name" id="currentSelectionName"></div>
                </div>
            </div>

            <div class="config-info">
                <h3 id="systemConfigTitle"></h3>
                <ul class="binaural-options" id="binauralOptionsList"></ul>
                <button onclick="testDevice()" class="device-test-btn" id="deviceTestBtn"></button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <h2 id="sectionMonitor" class="section-title"></h2>
        <div class="breathing-monitor">
            <div class="breath-visual">
                <h3></h3>
                <canvas id="waveform" class="waveform"></canvas>
            </div>

            <div class="breath-stats">
                <h3></h3>
                <div class="stat-item">
                    <span class="stat-label"></span>
                    <span class="stat-value" id="breathRate">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" id="noiseLevelLabel"></span>
                    <span class="stat-value" id="noiseLevel">--</span>
                </div>
            </div>
        </div>

        <div class="control-buttons">
            <button onclick="toggleAdaptiveMode()" id="monitorToggleBtn"></button>
        </div>
    </div>

    <div class="trust-badges">
        <span id="trustFree" class="trust-badge"></span>
        <span id="trustOpenSource" class="trust-badge"></span>
        <span id="trustPrivacy" class="trust-badge"></span>
    </div>

    
    <div class="share-section">
        <span id="shareTitle" class="share-title"></span>
        <div class="share-buttons">
            <a id="shareTwitter" class="share-btn share-twitter" href="#" target="_blank" rel="noopener">Twitter</a>
            <a id="shareFacebook" class="share-btn share-facebook" href="#" target="_blank" rel="noopener">Facebook</a>
            <a id="shareLine" class="share-btn share-line" href="#" target="_blank" rel="noopener">LINE</a>
        </div>
    </div>

    
    <div class="faq-section">
        <h2 id="faqTitle" class="section-title"></h2>
        <div id="faqList" class="faq-list"></div>
    </div>

    <div class="footer">
        <a href="https://github.com/weiqi-kids/vuko.life" target="_blank">GitHub</a>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/ga.js" async></script>
    <script src="js/audio_selector.js" defer></script>
    <script src="js/binaural_processor.js" defer></script>
    <script src="js/onboarding.js" defer></script>
    <script src="js/session_tracker.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/keyboard.js" defer></script>
    <script src="js/lang-switcher.js" defer></script>
    <script>CONFIG.LANGUAGE = 'uk';</script>
</body>
</html>
