<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免費開源的 AI 呼吸引導工具 - 透過雙耳拍頻進入冥想、專注或深層睡眠。即時監測呼吸，智能調整頻率。完全免費，音訊不上傳。">
    <title>用聲音，帶你遇見更好的自己</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="用聲音，帶你遇見更好的自己" />
    <meta property="og:description" content="免費開源的 AI 呼吸引導工具。透過雙耳拍頻進入冥想、專注或深層睡眠，即時監測呼吸，智能調整頻率。" />
    <meta property="og:image" content="https://www.vuko.life/assets/zh-tw/home-og.jpg" />
    <meta property="og:url" content="https://www.vuko.life/app/zh-tw.html" />

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="用聲音，帶你遇見更好的自己">
    <meta name="twitter:description" content="免費開源的 AI 呼吸引導工具。透過雙耳拍頻進入冥想、專注或深層睡眠，即時監測呼吸，智能調整頻率。">
    <meta name="twitter:image" content="https://www.vuko.life/assets/zh-tw/home-og.jpg">
    <base href="../">
    <link rel="canonical" href="https://www.vuko.life/app/zh-tw.html" />
    <link rel="stylesheet" href="assets/base.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vuko - 智能呼吸節奏處理器",
        "description": "透過雙耳拍頻引導你進入冥想、專注、放鬆或睡眠狀態",
        "url": "https://www.vuko.life/app/zh-tw.html",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "featureList": ["Binaural Beats", "Breath Monitoring", "Meditation", "Sleep Aid", "Focus Enhancement"]
    }
    </script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切換深色模式">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
    </button>
    <div class="container">
        <h1 id="mainTitle">用聲音，帶你遇見更好的自己</h1>

        <h2 id="sectionInstructions" class="section-title">使用說明</h2>
        <div class="adaptive-mode">
            <h3>🤖 使用說明</h3>
            <ul>
                <li id="instructionHeadphones">請使用<strong>雙聲道耳機</strong>，這樣才能達成腦中拍頻的效果。</li>
                <li id="instructionMicrophone">若您同意使用您的<strong>麥克風</strong>，請將麥克風靠近口鼻，我們會嘗試引導您進入更深層的狀態。</li>
            </ul>
        </div>

        <h2 id="sectionSettings" class="section-title">功能設定</h2>
        <div class="config-audio-container">
            <div class="audio-search-section">
                <h3 id="audioSearchTitle">🎵 背景音樂搜尋</h3>
                <div class="audio-tabs">
                    <button id="tabLibrary" class="tab-button active">線上音庫</button>
                    <button id="tabLocal" class="tab-button">本機檔案</button>
                </div>
                <div id="libraryTabContent">
                    <div class="search-container">
                        <input type="text" id="musicSearchInput" class="search-input" placeholder="">
                    </div>
                    <div id="searchResults" class="search-results" style="display: none;"></div>
                </div>
                <div id="localTabContent" style="display: none;">
                    <input type="file" id="localFileInput" accept="audio/*">
                    <div class="privacy-msg" id="filePrivacyMsg"></div>
                </div>
                <div id="currentSelection" class="current-selection" style="display: none;">
                    <div class="current-selection-label" id="currentSelectionLabel"></div>
                    <div class="current-selection-name" id="currentSelectionName"></div>
                </div>
            </div>

            <div class="config-info">
                <h3 id="systemConfigTitle">雙耳拍頻設置</h3>
                <ul class="binaural-options" id="binauralOptionsList"></ul>
                <button onclick="testDevice()" class="device-test-btn" id="deviceTestBtn">🎤 設備測試</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <h2 id="sectionMonitor" class="section-title">呼吸監測</h2>
        <div class="breathing-monitor">
            <div class="breath-visual">
                <h3>呼吸視覺化</h3>
                <canvas id="waveform" class="waveform"></canvas>
            </div>

            <div class="breath-stats">
                <h3>即時數據</h3>
                <div class="stat-item">
                    <span class="stat-label">呼吸速率：</span>
                    <span class="stat-value" id="breathRate">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" id="noiseLevelLabel"></span>
                    <span class="stat-value" id="noiseLevel">--</span>
                </div>
            </div>
        </div>

        <div class="control-buttons">
            <button onclick="toggleAdaptiveMode()" id="monitorToggleBtn">🎶 開始</button>
        </div>
    </div>

    <div class="trust-badges">
        <span id="trustFree" class="trust-badge">✓ 完全免費，無需註冊</span>
        <span id="trustOpenSource" class="trust-badge">✓ 開源專案</span>
        <span id="trustPrivacy" class="trust-badge">✓ 音訊僅在本機處理，不上傳伺服器</span>
    </div>

    <div class="share-section">
        <span id="shareTitle" class="share-title">分享</span>
        <div class="share-buttons">
            <a id="shareTwitter" class="share-btn share-twitter" href="#" target="_blank" rel="noopener">Twitter</a>
            <a id="shareFacebook" class="share-btn share-facebook" href="#" target="_blank" rel="noopener">Facebook</a>
            <a id="shareLine" class="share-btn share-line" href="#" target="_blank" rel="noopener">LINE</a>
        </div>
    </div>

    <div class="faq-section">
        <h2 id="faqTitle" class="section-title"></h2>
        <div id="faqList" class="faq-list"></div>
    </div>

    <div class="footer">
        <a href="https://github.com/weiqi-kids/vuko.life" target="_blank">GitHub</a>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/ga.js" async></script>
    <script src="js/audio_selector.js" defer></script>
    <script src="js/binaural_processor.js" defer></script>
    <script src="js/onboarding.js" defer></script>
    <script src="js/session_tracker.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/keyboard.js" defer></script>
    <script src="js/lang-switcher.js" defer></script>
    <script>CONFIG.LANGUAGE = 'zh-tw';</script>
</body>
</html>
